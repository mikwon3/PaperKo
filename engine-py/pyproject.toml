[project]
name = "translate_engine"
version = "1.8.10"
description = "PaperKo — academic PDF → Korean translation engine (parse · layout · translate · re-render)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pysbd>=0.3.4",
    "python-docx>=1.1",   # DOCX export + intermediate for HWPX conversion
    "latex2mathml>=3.77", # equation LaTeX → MathML …
    "mathml2omml>=0.0.2", # … → OMML (native Word math; HWPX converter reads it too)
]

[project.optional-dependencies]
fast = ["pyahocorasick>=2.0"]
math = ["matplotlib>=3.7"]   # inline-math rendering ($…$ → image); off by default
# Offline equation recognition fallback (ONNX math-OCR) for when the configured
# LLM has no vision. Bundled by default via the build scripts.
mathocr = [
    "rapid_latex_ocr>=0.0.9",
    "requests>=2.25",   # undeclared runtime dep of rapid_latex_ocr
    "pillow>=10",       # tight-crop the equation image before OCR
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
translate-engine = "translate_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["translate_engine*"]

[tool.setuptools.package-data]
translate_engine = [
    "fonts/*.ttf", "fonts/*.otf", "fonts/*.txt", "tessdata/*.traineddata",
    "hwpx/scripts/*.py", "hwpx/assets/*.hwpx", "hwpx/assets/*.xml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
